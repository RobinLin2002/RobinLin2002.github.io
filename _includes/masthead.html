<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="/#home"><strong>Ziyue Lin</strong><span>AI Researcher</span></a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item masthead__menu-item--controls">
            <div class="site-controls" aria-label="Site preferences">
              <button type="button" class="site-control" id="language-toggle" aria-label="Switch to Chinese">中文</button>
              <button type="button" class="site-control" id="theme-toggle" aria-label="Switch to dark mode">☾</button>
            </div>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
